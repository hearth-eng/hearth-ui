<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Categories & Services — Hearth</title>
        <meta name="description" content="Browse every Hearth service by category — salon & makeup, cleaning & pest control, appliance repair, electrician & plumbing, and painting — with upfront pricing.">
        <meta name="theme-color" content="#0f5c5a">

        <meta property="og:title" content="Categories & Services — Hearth">
        <meta property="og:description" content="Browse every Hearth service by category — salon & makeup, cleaning & pest control, appliance repair, electrician & plumbing, and painting — with upfront pricing.">
        <meta property="og:type" content="website">

        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>
    <body>

        <a class="skip-link" href="#main-content">Skip to main content</a>

        <!-- ============ HEADER / STICKY NAVIGATION ============ -->
        <div id="siteHeaderSlot"></div>

        <main id="main-content">

            <!-- ============ PAGE HERO ============ -->
            <section class="page-hero">
                <div class="section-inner">
                    <p class="breadcrumb"><a href="index">Home</a><span aria-hidden="true">/</span><span>Categories</span></p>
                    <p class="eyebrow" id="catStatTotal">Loading services…</p>
                    <h1>Browse every service</h1>
                    <p class="page-lede">From a quick tap repair to a full home makeover — find the exact service you need, see the price upfront, and add it to your booking.</p>

                    <div class="cat-search">
                        <div class="cat-search-field">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm10 2-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <label for="catSearchInput" class="visually-hidden">Search services</label>
                            <input type="text" id="catSearchInput" placeholder="Search for a service, e.g. &quot;AC repair&quot; or &quot;facial&quot;" autocomplete="off">
                            <button type="button" class="cat-search-clear" id="catSearchClear" aria-label="Clear search">&times;</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ============ CATEGORY / SUBCATEGORY NAV ============ -->
            <nav class="cat-subnav" aria-label="Service categories">
                <div class="section-inner">
                    <div class="cat-pill-row" id="catPillRow"></div>
                    <div class="subcat-chip-row" id="subcatChipRow"></div>
                </div>
            </nav>

            <!-- ============ SERVICE GRID ============ -->
            <section class="section" style="padding-top: var(--space-md);">
                <div class="section-inner">
                    <div class="cat-banner" id="catBanner" aria-hidden="true"></div>
                    <p class="cat-results-meta" id="catResultsMeta" aria-live="polite"></p>
                    <div class="sku-grid" id="skuGrid"></div>
                </div>
            </section>

            <!-- ============ STICKY CART BAR ============ -->
            <div class="cart-bar" id="cartBar" aria-live="polite">
                <div class="cart-bar-info">
                    <span class="cart-bar-count" id="cartBarCount">0 services added</span>
                    <span class="cart-bar-total" id="cartBarTotal">₹0</span>
                </div>
                <button type="button" class="cart-bar-cta" id="cartBarCta">Continue</button>
            </div>

        </main>

        <!-- ============ FOOTER ============ -->
        <div id="siteFooterSlot"></div>

        <button class="back-to-top" id="backToTop" aria-label="Back to top">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <script src="../resources/js/layout.js"></script>
        <script src="../resources/js/api.js"></script>
        <script src="../resources/js/script.js"></script>
        <script src="../resources/js/scheduling.js"></script>
        <!--script src="../resources/js/categories-data.js"></script-->
        <script src="../resources/js/categories.js"></script>
    </body>
</html>
