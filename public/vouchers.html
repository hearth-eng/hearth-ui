<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Vouchers — Hearth</title>
        <meta name="description" content="View and copy the offers and credits available on your Hearth account.">
        <meta name="theme-color" content="#0f5c5a">

        <meta property="og:title" content="My Vouchers — Hearth">
        <meta property="og:description" content="View and copy the offers and credits available on your Hearth account.">
        <meta property="og:type" content="website">

        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>
    <body>

        <a class="skip-link" href="#main-content">Skip to main content</a>

        <!-- ============ HEADER / STICKY NAVIGATION ============ -->
        <div id="siteHeaderSlot"></div>

        <main id="main-content">


            <!-- ============ PAGE HERO ============ -->
            <section class="page-hero">
                <div class="section-inner">
                    <p class="breadcrumb"><a href="index">Home</a><span aria-hidden="true">/</span><span>Vouchers</span></p>
                    <p class="eyebrow">Your account</p>
                    <h1>My Vouchers</h1>
                    <p class="page-lede">Offers and credits available on your account — apply a code at checkout to redeem it.</p>
                </div>
            </section>


            <section class="section" style="padding-top: var(--space-md);">
                <div class="section-inner">
                    <div class="account-layout">
                        <aside class="account-sidebar">
                            <nav class="account-nav" aria-label="Account navigation">
                                <a href="profile" class="account-nav-link">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                    <span>Profile &amp; Address</span>
                                </a>
                                <a href="bookings" class="account-nav-link">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                    <span>My Bookings</span>
                                </a>
                                <a href="vouchers" class="account-nav-link is-active">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1a2 2 0 0 0 0 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a2 2 0 0 0 0-4V9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 7v10" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>
                                    <span>Vouchers</span>
                                </a>
                                <a href="favourites" class="account-nav-link">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                                    <span>Favourites &amp; Wishlist</span>
                                </a>
                            </nav>
                        </aside>
                        <div class="account-main">

                            <!-- ============ LOGGED-OUT GATE ============ -->
                            <div id="vouchersGate" hidden>
                                <div class="address-empty-state" style="background: var(--color-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-lg);">
                                    <span class="address-empty-icon" aria-hidden="true">
                                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                                    </span>
                                    <p>You'll need to sign up or log in to see your vouchers.</p>
                                    <button type="button" class="btn btn-primary btn-ripple" id="vouchersGateSignupBtn">Sign Up / Log In</button>
                                </div>
                            </div>

                            <!-- ============ VOUCHERS CONTENT ============ -->
                            <div id="vouchersContent" hidden>
                                <div class="voucher-grid" id="vouchersGrid"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- ============ FOOTER ============ -->
        <div id="siteFooterSlot"></div>

        <button class="back-to-top" id="backToTop" aria-label="Back to top">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <script src="../resources/js/layout.js"></script>
        <script src="../resources/js/api.js"></script>
        <script src="../resources/js/script.js"></script>
        <script src="../resources/js/vouchers.js"></script>
    </body>
</html>
